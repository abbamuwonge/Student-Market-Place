$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Is the seller", function () { const json = pm.response.json(); pm.expect(json.user_id).to.eql(Number(pm.collectionVariables.get("sellerId"))); });
    language: text/javascript
order: 11000
