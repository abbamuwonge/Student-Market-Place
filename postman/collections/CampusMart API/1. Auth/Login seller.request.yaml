$kind: http-request
description: Requirement FR3. Saves the token for the next requests.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{sellerEmail}}",
      "password": "password123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Returns a JWT access token", function () { const json = pm.response.json(); pm.expect(json.access_token).to.be.a("string").and.not.empty; pm.expect(json.token_type).to.eql("bearer"); });
      pm.test("Returns the user", function () { const json = pm.response.json(); pm.expect(json.user.user_id).to.eql(Number(pm.collectionVariables.get("sellerId"))); });
      pm.collectionVariables.set("sellerToken", pm.response.json().access_token);
    language: text/javascript
order: 5000
