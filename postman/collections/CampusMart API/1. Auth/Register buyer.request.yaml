$kind: http-request
description: Requirement FR1, FR4. Creates a user with a unique email each run.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Postman Buyer",
      "email": "{{buyerEmail}}",
      "phone": "0759999999",
      "campus": "Makerere University",
      "password": "password123"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("buyerEmail", "buyer" + Date.now() + "@student.ug");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      pm.test("Returns the new user without any password", function () { const json = pm.response.json(); pm.expect(json.email).to.eql(pm.collectionVariables.get("buyerEmail")); pm.expect(json).to.not.have.property("password_hash"); pm.expect(json).to.not.have.property("password"); });
      pm.test("Phone is normalised to 256 format", function () { const json = pm.response.json(); pm.expect(json.phone).to.eql("256759999999"); });
      pm.test("New users are students", function () { const json = pm.response.json(); pm.expect(json.role).to.eql("student"); });
      pm.collectionVariables.set("buyerId", pm.response.json().user_id);
    language: text/javascript
order: 2000
