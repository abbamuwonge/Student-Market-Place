$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{sellerEmail}}",
      "password": "wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 7000
