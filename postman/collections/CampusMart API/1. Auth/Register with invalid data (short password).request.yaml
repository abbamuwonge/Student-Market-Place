$kind: http-request
description: Invalid input must return 400 (not 422).
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "A",
      "email": "not-an-email",
      "phone": "123",
      "campus": "M",
      "password": "short"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
      pm.test("Lists the invalid fields", function () { const json = pm.response.json(); pm.expect(json.errors).to.be.an("array").that.is.not.empty; pm.expect(json.errors[0]).to.have.keys("field", "message"); });
    language: text/javascript
order: 4000
