$kind: http-request
url: "{{baseUrl}}/categories"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Has the seeded categories", function () { const json = pm.response.json(); pm.expect(json).to.be.an("array").with.length.of.at.least(9); });
      pm.collectionVariables.set("categoryId", pm.response.json()[0].category_id);
    language: text/javascript
order: 1000
