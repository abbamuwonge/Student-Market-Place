$kind: http-request
url: "{{baseUrl}}/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Test {{$timestamp}}",
      "icon": "T"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("newCategoryId", pm.response.json().category_id);
    language: text/javascript
order: 3000
