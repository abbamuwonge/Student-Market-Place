$kind: http-request
description: Only admins manage categories (FR27).
url: "{{baseUrl}}/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Not allowed"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 2000
