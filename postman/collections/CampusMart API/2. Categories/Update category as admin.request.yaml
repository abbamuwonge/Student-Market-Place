$kind: http-request
url: "{{baseUrl}}/categories/{{newCategoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Renamed {{$timestamp}}",
      "icon": "R"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Icon changed", function () { const json = pm.response.json(); pm.expect(json.icon).to.eql("R"); });
    language: text/javascript
order: 4000
