$kind: http-request
url: "{{baseUrl}}/categories/{{newCategoryId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
