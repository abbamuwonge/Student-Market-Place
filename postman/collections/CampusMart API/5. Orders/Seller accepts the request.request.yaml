$kind: http-request
description: FR22
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "accepted"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Accepted and phones are now shared", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("accepted"); pm.expect(json.buyer.phone).to.eql("256759999999"); });
    language: text/javascript
order: 9000
