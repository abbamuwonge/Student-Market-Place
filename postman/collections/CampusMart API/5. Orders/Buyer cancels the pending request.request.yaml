$kind: http-request
description: FR23
url: "{{baseUrl}}/orders/{{orderId2}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "cancelled"
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Cancelled", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("cancelled"); });
    language: text/javascript
order: 16000
