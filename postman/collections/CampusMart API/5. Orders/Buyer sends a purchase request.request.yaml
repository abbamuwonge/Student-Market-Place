$kind: http-request
description: FR21
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "item_id": {{itemId}},
      "note": "Can we meet tomorrow at 2pm?"
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      pm.test("Request is pending at the current price", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("pending"); pm.expect(json.price_at_order).to.eql(16000); });
      pm.test("Phone numbers hidden until accepted", function () { const json = pm.response.json(); pm.expect(json.buyer.phone).to.be.null; pm.expect(json.seller.phone).to.be.null; });
      pm.collectionVariables.set("orderId", pm.response.json().order_id);
    language: text/javascript
order: 3000
