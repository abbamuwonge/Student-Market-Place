$kind: http-request
description: "Business rule: accepting reserves the item."
url: "{{baseUrl}}/items/{{itemId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Reserved", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("reserved"); });
    language: text/javascript
order: 10000
