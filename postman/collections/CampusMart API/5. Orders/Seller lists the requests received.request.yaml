$kind: http-request
description: FR22
url: "{{baseUrl}}/orders/received"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Contains the order", function () { const json = pm.response.json(); pm.expect(json.map(o => o.order_id)).to.include(Number(pm.collectionVariables.get("orderId"))); });
    language: text/javascript
order: 6000
