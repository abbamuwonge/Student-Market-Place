$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "item_id": {{itemId}} }'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
