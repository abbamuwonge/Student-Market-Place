$kind: http-request
url: "{{baseUrl}}/items/{{itemId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Sold", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("sold"); });
    language: text/javascript
order: 12000
