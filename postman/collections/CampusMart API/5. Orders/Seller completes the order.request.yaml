$kind: http-request
description: FR24
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "completed"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Completed", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("completed"); });
    language: text/javascript
order: 11000
