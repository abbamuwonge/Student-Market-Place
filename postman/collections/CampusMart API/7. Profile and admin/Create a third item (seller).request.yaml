$kind: http-request
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_id": {{categoryId}},
      "title": "Postman Inappropriate Listing",
      "description": "Postman test item, safe to delete.",
      "price": 5000,
      "item_condition": "used good",
      "pickup_location": "Main Gate"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("itemId3", pm.response.json().item_id);
    language: text/javascript
order: 3000
