$kind: http-request
name: "Inbox again: the chat is now read"
url: "{{baseUrl}}/messages/conversations"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("No unread messages", function () { const json = pm.response.json(); const c = json.find(x => x.other_user_id === Number(pm.collectionVariables.get("buyerId"))); pm.expect(c.unread_count).to.eql(0); });
    language: text/javascript
order: 7000
