$kind: http-request
description: FR26
url: "{{baseUrl}}/messages/conversations"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Shows an unread chat with the buyer", function () { const json = pm.response.json(); const c = json.find(x => x.other_user_id === Number(pm.collectionVariables.get("buyerId"))); pm.expect(c).to.exist; pm.expect(c.unread_count).to.be.at.least(1); pm.expect(c.item_title).to.be.a("string"); });
    language: text/javascript
order: 5000
