$kind: http-request
url: "{{baseUrl}}/messages"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "receiver_id": {{buyerId}}, "body": "hello me" }'
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 2000
