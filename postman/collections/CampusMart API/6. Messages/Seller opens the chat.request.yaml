$kind: http-request
description: FR25
url: "{{baseUrl}}/messages/thread?with_user={{buyerId}}&item_id={{itemId}}"
method: GET
queryParams:
  with_user: "{{buyerId}}"
  item_id: "{{itemId}}"
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Contains the message", function () { const json = pm.response.json(); pm.expect(json.map(m => m.body)).to.include("Is it still available?"); });
    language: text/javascript
