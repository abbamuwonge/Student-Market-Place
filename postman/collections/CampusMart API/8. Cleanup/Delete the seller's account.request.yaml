$kind: http-request
description: Also deletes their items, orders and messages.
url: "{{baseUrl}}/users/me"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
