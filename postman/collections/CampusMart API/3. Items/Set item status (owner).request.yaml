$kind: http-request
description: FR18
url: "{{baseUrl}}/items/{{itemId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "available"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Status saved", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("available"); });
    language: text/javascript
order: 17000
