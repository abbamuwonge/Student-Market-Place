$kind: http-request
description: FR9
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_id": {{categoryId}},
      "title": "Postman Calculus Book",
      "description": "Postman test item, safe to delete.",
      "price": 15000,
      "item_condition": "used good",
      "pickup_location": "Main Gate"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      pm.test("New items are available", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("available"); pm.expect(json.price).to.eql(15000); });
      pm.collectionVariables.set("itemId", pm.response.json().item_id);
    language: text/javascript
order: 1000
