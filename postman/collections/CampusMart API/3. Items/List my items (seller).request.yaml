$kind: http-request
description: FR19
url: "{{baseUrl}}/users/me/items"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Contains the item", function () { const json = pm.response.json(); pm.expect(json.map(i => i.item_id)).to.include(Number(pm.collectionVariables.get("itemId"))); });
    language: text/javascript
order: 20000
