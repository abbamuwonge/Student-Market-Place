$kind: http-request
description: "FR16: only the owner may edit."
url: "{{baseUrl}}/items/{{itemId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_id": {{categoryId}},
      "title": "Hijacked",
      "description": "Postman test item, safe to delete.",
      "price": 1,
      "item_condition": "used good",
      "pickup_location": "Main Gate"
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 15000
