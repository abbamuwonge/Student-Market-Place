$kind: http-request
description: FR16
url: "{{baseUrl}}/items/{{itemId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_id": {{categoryId}},
      "title": "Postman Calculus Book",
      "description": "Postman test item, safe to delete.",
      "price": 16000,
      "item_condition": "used good",
      "pickup_location": "Main Gate"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Price changed", function () { const json = pm.response.json(); pm.expect(json.price).to.eql(16000); pm.expect(json.updated_at).to.not.be.null; });
    language: text/javascript
order: 16000
