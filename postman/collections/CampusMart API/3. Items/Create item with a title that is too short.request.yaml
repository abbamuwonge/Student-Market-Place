$kind: http-request
description: FR10
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_id": {{categoryId}},
      "title": "ab",
      "description": "Postman test item, safe to delete.",
      "price": 1000,
      "item_condition": "used good",
      "pickup_location": "Main Gate"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 5000
