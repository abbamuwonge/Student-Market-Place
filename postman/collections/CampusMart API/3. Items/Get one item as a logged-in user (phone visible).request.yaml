$kind: http-request
description: FR15
url: "{{baseUrl}}/items/{{itemId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Seller phone is shown", function () { const json = pm.response.json(); pm.expect(json.seller.phone).to.eql("256771234567"); });
    language: text/javascript
order: 13000
