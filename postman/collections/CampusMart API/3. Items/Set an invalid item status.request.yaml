$kind: http-request
url: "{{baseUrl}}/items/{{itemId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "gone"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 18000
