$kind: http-request
description: In the Body tab pick a real JPG, PNG or WEBP file for the 'file' field, then send. When the collection runs without a file chosen this request is expected to return 400.
url: "{{baseUrl}}/items/{{itemId}}/image"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 with a photo, or 400 when no file was chosen", function () { pm.expect([200, 400]).to.include(pm.response.code); });
      if (pm.response.code === 200) { pm.test("Photo address returned", function () { pm.expect(pm.response.json().image_url).to.match(/^\/uploads\//); }); }
    language: text/javascript
order: 19000
