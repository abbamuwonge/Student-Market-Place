$kind: http-request
description: FR14
url: "{{baseUrl}}/items?sort=price_asc"
method: GET
queryParams:
  sort: price_asc
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Prices go up", function () { const json = pm.response.json(); const p = json.map(i => i.price); pm.expect(p).to.eql([...p].sort((a, b) => a - b)); });
    language: text/javascript
order: 9000
