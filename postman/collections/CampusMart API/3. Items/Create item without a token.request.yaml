$kind: http-request
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_id": {{categoryId}},
      "title": "No token",
      "description": "Postman test item, safe to delete.",
      "price": 1000,
      "item_condition": "used good",
      "pickup_location": "Main Gate"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
