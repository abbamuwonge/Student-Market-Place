$kind: http-request
description: FR11
url: "{{baseUrl}}/items"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Contains the new item", function () { const json = pm.response.json(); pm.expect(json.map(i => i.item_id)).to.include(Number(pm.collectionVariables.get("itemId"))); });
      pm.test("Never exposes phone numbers in lists", function () { const json = pm.response.json(); json.forEach(i => pm.expect(i.seller.phone).to.be.null); });
    language: text/javascript
order: 6000
