$kind: http-request
url: "{{baseUrl}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("API reports ok", function () { const json = pm.response.json(); pm.expect(json.status).to.eql("ok"); });
    language: text/javascript
order: 9000
