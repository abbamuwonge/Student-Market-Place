$kind: http-request
description: FR29
url: "{{baseUrl}}/favorites"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Not in the seller's list", function () { const json = pm.response.json(); pm.expect(json.map(i => i.item_id)).to.not.include(Number(pm.collectionVariables.get("itemId"))); });
    language: text/javascript
order: 5000
