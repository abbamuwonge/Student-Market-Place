$kind: http-request
url: "{{baseUrl}}/favorites"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "item_id": 999999
    }
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 3000
