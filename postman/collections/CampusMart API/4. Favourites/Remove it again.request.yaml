$kind: http-request
url: "{{baseUrl}}/favorites/{{itemId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{buyerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 7000
